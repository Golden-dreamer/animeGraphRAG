[project]
name = "anime-graphrag"
version = "24.0.0"
description = "Anime GraphRAG — MAL parsers + Neo4j + LLM GraphRAG backend"
requires-python = ">=3.12"

# Все зависимости в одном месте.
# Каждый Dockerfile ставит только нужную группу через `uv pip install --group`.
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "requests==2.32.3",
    "neo4j==5.24.0",
    "PyYAML==6.0.2",
    "beautifulsoup4==4.12.3",
    "httpx==0.27.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"